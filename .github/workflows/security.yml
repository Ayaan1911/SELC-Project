name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        env:
          SECURECART_JWT_SECRET: ci-test-secret-never-used-outside-this-workflow
        run: python -m pytest -v

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep (fails the build on ERROR/high-severity findings)
        run: |
          semgrep \
            --config p/security-audit --config p/owasp-top-ten \
            --config p/python --config p/javascript --config p/secrets \
            --severity ERROR --error \
            backend/ frontend/src/

  bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (-lll = report/fail on HIGH severity only)
        run: bandit -r backend/ -lll

  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run Gitleaks (any committed secret fails the build)
        run: ./gitleaks detect --source . --redact -v

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (any known vulnerability fails the build)
        run: pip-audit -r backend/requirements.txt

  npm-audit:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run npm audit (fails the build on high/critical severity only)
        working-directory: frontend
        run: npm audit --audit-level=high
